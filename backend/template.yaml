AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: The Blue Fit - FastAPI Backend

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: >-
      Websites / apps allowed to call this API from a browser. Add your production web
      domain here and, for phone testing on your Wi-Fi, your dev server address.
    Default: "http://localhost:3000,http://localhost,https://localhost,capacitor://localhost,https://bluefit-1g5.pages.dev"

Globals:
  Function:
    Timeout: 15
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - arm64

Resources:
  AuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Signing key for The Blue Fit session tokens (auto-generated)
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  BlueFitDatabase:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: BlueFit-Table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ClientMediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods:
              - POST
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 300

  BlueFitHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        # Chat polling + the 45-second presence heartbeat from every open app share this limit.
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders:
          - Authorization
          - Content-Type
          - Accept
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600

  CoreApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/core_api/
      Handler: main.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref BlueFitDatabase
          AUTH_SECRET_ARN: !Ref AuthSecret
          CLIENT_MEDIA_BUCKET: !Ref ClientMediaBucket
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlueFitDatabase
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref AuthSecret
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub "${ClientMediaBucket.Arn}/clients/*"
                - !Sub "${ClientMediaBucket.Arn}/coaches/*"
      Events:
        FastApiCatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlueFitHttpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: >-
      Base URL for the unified FastAPI backend.
      Put this in NEXT_PUBLIC_API_URL without a trailing slash.
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com"
      - ApiId: !Ref BlueFitHttpApi
  TableName:
    Description: DynamoDB table name
    Value: !Ref BlueFitDatabase
  ClientMediaBucketName:
    Description: Private S3 bucket for client 3-day-log photos
    Value: !Ref ClientMediaBucket
  AuthSecretArn:
    Description: ARN of the AWS-generated session signing secret
    Value: !Ref AuthSecret
